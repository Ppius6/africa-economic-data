version: 2

sources:
  - name: pg_bridge
    schema: pg_bridge
    description: >
      Read-through tables in ClickHouse, each defined with the PostgreSQL
      table engine. These store no data of their own — every query forwards
      straight to the matching Postgres staging or core table, live, at read time.
      Exists so the marts can reference staging and core without dbt trying to ref()
      across two adapters in one run.
    tables:
      - name: stg_countries
        description: Bridge to Postgres staging.stg_countries.
      - name: stg_indicators
        description: Bridge to Postgres staging.stg_indicators.
      - name: dim_country_snapshot
        description: Bridge to Postgres core.dim_country_snapshot, the country income-classification SCD2 snapshot.
      - name: income_classification_history
        description: Bridge to Postgres core.income_classification_history, the pre-cutover income-classification seed.
      - name: fct_indicator_value_snapshot
        description: Bridge to Postgres core.fct_indicator_value_snapshot, the per-indicator value revision-history snapshot.
      - name: stg_comtrade_areas
        description: Bridge to Postgres staging.stg_comtrade_areas, one row per Comtrade area code (M49) with type, ISO3 and scope.
      - name: int_comtrade_bilateral_flows
        description: Bridge to Postgres core.int_comtrade_bilateral_flows, both ends' reported figures per year x exporter x importer.
