version: 2

sources:
  - name: bronze
    schema: bronze
    tables:
      - name: country_raw
        description: Raw WDI country metadata, one row per country, landed as JSONB.
        columns:
          - name: country_code
            tests:
              - not_null
      - name: wdi_raw
        description: Raw WDI indicator data, one row per record returned by the API, landed as JSONB.
        columns:
          - name: indicator_code
            tests:
              - not_null
      - name: indicator_raw
        description: Raw WDI indicator metadata (name, unit, topic), one row per indicator.
        columns:
          - name: indicator_code
            tests:
              - not_null