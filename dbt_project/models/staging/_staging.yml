version: 2

models:
  - name: stg_countries
    description: One row per African country with flattened region, income level, and location metadata, unpacked from bronze's raw JSONB.
    columns:
      - name: country_code
        description: ISO3 country code.
        tests:
          - unique
          - not_null
      - name: country_name
        description: Full country name.
      - name: iso2_code
        description: ISO2 country code.
      - name: region_code
        description: WDI region grouping code.
        tests:
          - not_null
      - name: region_name
        description: WDI region grouping name.
      - name: income_level_code
        description: WDI income bracket code, as it stands today (not historized here — see dim_country_snapshot for history).
        tests:
          - not_null
      - name: income_level_name
        description: WDI income bracket name, as it stands today.
      - name: lending_type
        description: World Bank lending category.
      - name: capital_city
        description: Capital city name. NULL where WDI doesn't report one.
      - name: longitude
        description: Capital city longitude.
      - name: latitude
        description: Capital city latitude.
      - name: ingested_at
        description: Timestamp of the ingestion run that landed this row's underlying bronze data.

  - name: stg_indicators
    description: One row per WDI indicator with a curated category grouping, unpacked from bronze's raw JSONB.
    columns:
      - name: indicator_code
        description: WDI indicator code.
        tests:
          - unique
          - not_null
      - name: indicator_name
        description: Human-readable indicator name.
      - name: unit
        description: Always NULL in the current data — WDI doesn't populate this field for any indicator in scope.
      - name: category
        description: WDI's own topic grouping, taken from the first entry in the indicator's own topics metadata.

  - name: stg_wdi_indicators
    description: One row per country-indicator-year observation, unpivoted from raw WDI API response.
    columns:
      - name: country_code
        description: ISO3 country code.
        tests:
          - not_null
      - name: indicator_code
        description: WDI indicator code.
        tests:
          - not_null
      - name: indicator_name
        description: Human-readable indicator name, as reported alongside this specific observation.
      - name: year
        description: The year this observation describes.
        tests:
          - not_null
      - name: value
        description: The observed value. Frequently NULL for sparse indicators.
      - name: ingested_at
        description: Timestamp of the ingestion run that landed this row's underlying bronze data.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - country_code
              - indicator_code
              - year
