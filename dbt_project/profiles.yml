world_economic_data:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('INGESTION_DB_HOST', 'localhost') }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      port: "{{ env_var('INGESTION_DB_PORT', '5433') | as_number }}"
      dbname: "{{ env_var('POSTGRES_DB', 'worldbank') }}"
      schema: bronze
      threads: 4
    gold_clickhouse:
      type: clickhouse
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | as_number }}"
      user: "{{ env_var('CLICKHOUSE_USER') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD') }}"
      schema: gold
      threads: 4