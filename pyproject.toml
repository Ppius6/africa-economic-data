[project]
name = "world-economic-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.23",
    "dagster-dbt>=0.29.23",
    "dagster-postgres>=0.29.23",
    "dagster-project",
    "dagster-webserver>=1.13.23",
    "dbt-clickhouse>=1.10.3",
    "dbt-postgres>=1.11.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
]

[tool.uv.workspace]
members = [
    "dagster_project",
]

[tool.uv.sources]
dagster-project = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "shandy-sqlfmt[jinjafmt]>=0.32.0",
]

# The ingestion modules (wdi, comtrade, config, db) live in ingestion/, not in an
# installed package, so pytest needs that folder on the import path.
[tool.pytest.ini_options]
pythonpath = ["ingestion"]
testpaths = ["ingestion/tests"]
